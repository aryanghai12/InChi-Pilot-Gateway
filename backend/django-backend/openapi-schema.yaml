openapi: 3.0.3
info:
  title: InChi Pilot Gateway API
  version: v0.1.0
  description: Private internal API for BNCS InChi Pilot Gateway (Supplier & Demand
    Matching)
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      description: Bootstraps the CSRF cookie so the frontend can send X-CSRFToken
        headers on subsequent requests.
      summary: Set CSRF Cookie
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: CSRF cookie set successfully.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticates the user using email and password, creates an active
        session and rotates the CSRF token.
      summary: Internal User Login
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Invalid credentials or inactive account.
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Terminates the user's current session and flushes session data.
      summary: User Logout
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Logged out successfully.
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Returns the profile and role details of the currently signed-in
        user.
      summary: Current Authenticated User
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Registers a new user record with role assignment and issues a verification
        token.
      summary: Internal User Registration
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/users/:
    get:
      operationId: v1_auth_users_list
      description: |-
        Dedicated user management endpoints for Platform Administrators.
        Allows listing all users, updating roles, and activating or deactivating accounts.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: v1_auth_users_create
      description: |-
        Dedicated user management endpoints for Platform Administrators.
        Allows listing all users, updating roles, and activating or deactivating accounts.
      tags:
      - v1
