  /api/v1/auth/verify/:
    get:
      operationId: v1_auth_verify_retrieve
      description: Check whether a specific email account has already been verified.
      summary: Check Verification Status
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Returns verification status.
    post:
      operationId: v1_auth_verify_create
      description: Validates the verification token for a registered account and marks
        the account as verified.
      summary: Verify Account Token
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyAccountRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Account verified successfully.
        '400':
          description: Invalid or expired token.
  /api/v1/auth/verify/status/:
