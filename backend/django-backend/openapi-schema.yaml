      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminUpdate'
          description: ''
    delete:
      operationId: v1_auth_users_destroy
      description: |-
        Dedicated user management endpoints for Platform Administrators.
